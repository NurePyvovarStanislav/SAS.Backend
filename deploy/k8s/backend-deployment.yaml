apiVersion: apps/v1
kind: Deployment
metadata:
  name: sas-backend
  namespace: sas

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sas-backend

  template:
    metadata:
      labels:
        app: sas-backend

    spec:
      containers:
        - name: sas-backend
          image: merryandrew2/sas-backend:lab4
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - secretRef:
                name: sas-secrets

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development

            - name: RunMigrations
              value: "false"

            - name: MigrateOnly
              value: "false"

            - name: ASPNETCORE_URLS
              value: http://+:8080

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      terminationGracePeriodSeconds: 30