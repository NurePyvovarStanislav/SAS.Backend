apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: sas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.44.4
          command:
            - locust
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --host
            - http://sas-backend:8081
            - --web-host
            - 0.0.0.0
          ports:
            - name: web
              containerPort: 8089
          volumeMounts:
            - name: script
              mountPath: /mnt/locust
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: locust-script
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: sas
spec:
  type: ClusterIP
  selector:
    app: locust
  ports:
    - name: web
      port: 8089
      targetPort: web
